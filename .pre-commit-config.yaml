# pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/
  - repo: local
    hooks:
      - id: frontend-check
        name: frontend typecheck + eslint + prettier
        entry: bash -c 'cd frontend && npm run --silent check'
        language: system
        files: ^frontend/(src|e2e)/
        pass_filenames: false
